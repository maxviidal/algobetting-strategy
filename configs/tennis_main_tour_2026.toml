[dataset]
profile = "tennis_main_tour_2026"
sport_id = 12
entry_minutes_before_start = 60
closing_minutes_before_start = 5
# Keep this order stable: historical cache group indexes are positional.
# Pinnacle remains the probability reference; the other books are offers.
bookmakers = [
  "pinnacle", "bet365", "betano",
  "bwin", "unibet", "betway",
  "coral", "ladbrokes", "leovegas",
  "williamhill", "paddypower", "betfred",
  "888sport", "betsson", "skybet",
]
minimum_bookmakers = 5
quota_reserve = 5
historical_cooldown_seconds = 5.1
fixture_cooldown_seconds = 2.1

[calibration]
training_fraction = 0.60
validation_fraction = 0.20
minimum_training_matches = 200
bootstrap_samples = 200
block_days = 7
lower_quantile = 0.05
regularization = 10.0
random_seed = 20261000

[signals]
minimum_expected_value = 0.04

[staking]
kelly_fraction = 0.25
starting_equity = 10000.0

