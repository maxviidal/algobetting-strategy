[competition]
profile = "development_pilot_2023_24"
sport_key = "basketball_nba"
league = "NBA"
regular_season_only = true
season_start_years = [2023]
development_seasons = ["2023-24"]
validation_seasons = []
holdout_seasons = []

[market]
regions = ["eu"]
market_key = "h2h"
odds_format = "decimal"
include_overtime = true
exclude_exchanges = true

[selection]
entry_minutes_before_tip = 60
